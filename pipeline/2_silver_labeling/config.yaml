# ============================================================
# Silver Labeling Pipeline Configuration
# ============================================================

domains_file: ../../ontology/domains_19.yaml
domains: []

llm:
  provider: local
  model: llama3.1:8b
  base_url: http://localhost:11434/v1
  temperature: 0.7
  max_tokens: 1024
  timeout_sec: 180
  max_retries: 3
  retry_delay_sec: 2
  self_consistency_n: 5
  seed: 42

# The reports are in Korean and the model was prompted in Korean. This is the
# prompt as it was run. An English translation is given in Supplementary Note S1.
prompt:
  system: |
    당신은 자폐 스펙트럼 장애(ASD) 임상 보고서를 분석하는 전문 심리학자입니다.
    주어진 문장을 읽고, 해당 문장에 해당하는 도메인을 **모두** 선택하세요 (multi-label).

    규칙:
    1. 한 문장에 여러 도메인이 해당하면 모두 선택하세요. 가장 핵심적인 도메인을 맨 앞에 두세요.
    2. 각 도메인에 대해 confidence(0.0~1.0)를 부여하세요.
    3. 각 도메인마다 짧은 rationale(한국어, 1~2문장)을 작성하세요.
    4. 어떤 도메인에도 명확히 해당하지 않으면 "other_general" 하나만 선택하세요.
    5. 해당하는 도메인이 많더라도 가장 핵심적인 것만 **최대 3개까지** 선택하세요. 3개를 초과하지 말고, 우선순위가 높은 순서대로 나열하세요.

    반드시 아래 JSON 형식으로만 응답하세요 (추가 텍스트 금지):
    {
      "labels": [
        {
          "domain_id": "<도메인 ID>",
          "confidence": <0.0~1.0>,
          "rationale": "<근거>"
        }
      ]
    }

  user_template: |
    [도메인 목록]
    {domain_list}

    [문장]
    {sentence}

    위 문장에 해당하는 도메인을 핵심 순서대로 **최대 3개까지** 아래 JSON 형식으로 응답하세요 (가장 핵심적인 것을 맨 앞에):
    {{
      "labels": [
        {{
          "domain_id": "<도메인 ID>",
          "confidence": <0.0~1.0>,
          "rationale": "<근거>"
        }}
      ]
    }}

threshold:
  confidence_min: 0.5
  self_consistency_ratio: 0.5
  max_labels: 3

segmentation:
  # tokenizer_aligned reproduces the encoder's segmentation, so sentence indices
  # match the rows of the attention matrix. It is the only supported method.
  method: tokenizer_aligned
  min_length: 30
  max_length: 500

paths:
  input_dir: data/reports_txt_no_headings
  output_dir: data/silver_label
  log_dir: logs
  gold_labels: data/gold_label/gold_labels_26reports.jsonl
  silver_labels_file: silver_labels_489reports.jsonl

runtime:
  batch_size: 5
  resume: true
  save_every: 50
  verbose: true
